<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamber Member Directory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <img src="images/favicon.ico" width="24px" height="24px" alt="Home Logo" class="logo">
    <h1>Chamber of Commerce</h1>

    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#" class="active">Directory</a>
      <a href="#">Join</a>
      <a href="#">Discover</a>
      <button class="theme-toggle"></button>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Directory</h1>

    <!-- Grid / List Toggle Buttons -->
    <div class="view-menu">
      <button id="grid" class="active-view">Grid</button>
      <button id="list">List</button>
    </div>

    <!-- Member Cards Container -->
    <div id="members" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-contact">
      <p><strong>Chamber of Commerce</strong></p>
      <p>855 N Pugh </p>
      <p>Saratoga Springs, UT 84045</p>
      <p>info@saratoga.org</p>
      <p>(385) 312-7741</p>
    </div>

    <div class="Social">
        <a href=""><img src="images/facebooki.svg" width="24px" height="24px" alt="Facebook Logo"></a>
        <a href=""><img src="images/twitter-x.svg" width="24px" height="24px" alt="Twitter Logo"></a>
        <a href=""><img src="images/linkedin.svg" width="24px" height="24px" alt="LinkedIn Logo"></a>
        <a href=""><img src="images/github.svg" width="24px" height="24px" alt="GitHub Logo"></a>

        <p>&copy; current year.</p>
        <p>Last Updated</p>
    </div>
  </footer>

  <script src="directory.js"></script>
</body>
</html>
